    <circle cx="50" cy="50" r="41.6" fill="none" stroke="#fff3c6" stroke-width="1.5" opacity="0.95"/>
    <circle cx="50" cy="50" r="40.1" fill="none" stroke="#a46a0d" stroke-width="1.1" opacity="0.9"/>
