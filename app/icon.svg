      <stop offset="0.5" stop-color="#f4c13a"/>
      <stop offset="1" stop-color="#c47e0f"/>
    </radialGradient>
    <linearGradient id="relief" x1="32" y1="26" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d6"/>
