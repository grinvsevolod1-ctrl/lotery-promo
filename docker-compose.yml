# Production stack for a single VPS.
#
#   cp .env.example .env   # fill in the values
#   docker compose up -d --build
#   docker compose --profile analytics up -d   # optional: self-hosted Umami
#
# Caddy terminates TLS behind Cloudflare (certificate in ./deploy/certs) and proxies to the app; Postgres data,
# certificates and daily dumps live in named volumes / ./backups.

x-app-build: &app-build
  context: .
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-bytoloto.com}
    NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
    NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    NEXT_PUBLIC_SUPPORT_HOURS: ${NEXT_PUBLIC_SUPPORT_HOURS:-}
    NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
    NEXT_PUBLIC_VK_URL: ${NEXT_PUBLIC_VK_URL:-}
    DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-}

x-db-url: &db-url postgres://lotery:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/lotery

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lotery
      POSTGRES_USER: lotery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotery -d lotery"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs pending Drizzle migrations, then exits. `app` waits for it.
  migrate:
    build:
      <<: *app-build
      target: builder
    command: ["pnpm", "db:migrate"]
    env_file: .env
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      <<: *app-build
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *db-url
      # Caddy sits on the compose network; trust its forwarded client IP.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,127.0.0.1,::1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env (e.g. bytoloto.com)}
      STATS_DOMAIN: ${STATS_DOMAIN:-stats.${SITE_DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Daily pg_dump into ./backups, keeps BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: lotery
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: lotery
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Optional privacy-friendly analytics: docker compose --profile analytics up -d
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lotery:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me-openssl-rand-hex-32}
      DISABLE_TELEMETRY: "1"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy-data:
  caddy-config:
